[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercado-livre-monitor"
version = "0.1.0"
description = "Monitor local de ofertas do Mercado Livre com histórico SQLite e alertas Telegram."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mercado-livre-monitor = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
